[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "longmemory-smartring"
version = "0.1.0"
description = "面向个人智能终端的可测试长程记忆研究原型"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
console = ["aiohttp==3.13.2"]
semantic = ["transformers==4.57.6", "torch==2.8.0"]

# 小规模检索实验使用 CPU wheel，避免安装 CUDA 运行库；原依赖不受影响。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "semantic", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[project.scripts]
longmemory = "longmemory.entrypoints.cli.app:main"
longmemory-console = "longmemory.entrypoints.api.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
