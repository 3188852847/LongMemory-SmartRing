[project]
name = "longmemory-voxcpm-trial"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["voxcpm==2.0.3", "torch==2.8.0", "torchaudio==2.8.0", "torchcodec==0.7.0", "transformers==4.57.6"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
