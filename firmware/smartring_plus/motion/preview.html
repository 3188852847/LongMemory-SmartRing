<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>智慧圆屏 · 连续表情预览</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei UI",sans-serif;background:#050f1f;color:#e8f7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:radial-gradient(ellipse at 50% 0,#102e43,transparent 65%),#050f1f}main{width:min(920px,100%)}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:36px}h1{margin:0;font-weight:600;font-size:30px;letter-spacing:-.6px}p{color:#90b0c5;line-height:1.75}header p{margin:10px 0 0}.notice{color:#ffbd4a;font-size:13px}.workspace{display:grid;grid-template-columns:390px 1fr;gap:48px;align-items:center}.screen{position:relative;width:360px;height:360px;border-radius:50%;overflow:hidden;background:#071729;box-shadow:0 0 0 1px #21475d,0 0 0 14px #081321,0 25px 65px #0008;margin:16px}.screen::before{content:"";position:absolute;inset:22px;border:1px solid #12334a;border-radius:50%}.eyes,.mouth{position:absolute;left:50%;top:50%;background:#28d7f2;transform-origin:center;box-shadow:0 0 20px #28d7f233}.eyes{width:28px;height:36px;border-radius:20px}.mouth{width:36px;height:8px;border-radius:18px}.screen-label{position:absolute;left:0;right:0;text-align:center;top:51px;font-size:13px;color:#83a9bd}.subtitle{position:absolute;left:45px;right:45px;bottom:58px;text-align:center;color:#a8c5d6;font-size:13px}.controls h2{margin:0 0 12px;font-size:18px;font-weight:500}.button-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}button{font:inherit;font-size:14px;padding:9px 14px;cursor:pointer;border:1px solid #24475c;border-radius:9px;background:#0b2033;color:#a2c1d3}button[aria-pressed=true]{background:#123e52;border-color:#28d7f2;color:#e8f7ff}button:focus-visible,input:focus-visible{outline:2px solid #ffbd4a;outline-offset:4px}.description{min-height:52px}label{font-size:14px;color:#a2c1d3;display:flex;align-items:center;gap:9px}input{accent-color:#28d7f2}footer{margin-top:40px;font-size:13px;color:#7197ad;border-top:1px solid #153348;padding-top:18px;line-height:1.8}@media(max-width:760px){body{padding:24px 14px}header{display:block}.notice{margin-top:16px}.workspace{grid-template-columns:1fr;gap:30px}.screen{margin:16px auto;width:340px;height:340px}.controls{max-width:400px;margin:auto}h1{font-size:25px}}@media(hover:hover) and (pointer:fine){button:hover{border-color:#477993}}
</style></head><body><main>
<header><div><h1>让圆屏的表情自然流动</h1><p>持续的小动作，与真实交互状态分别组合。</p></div><span class="notice">电脑模拟 · 尚未烧录设备</span></header>
<section class="workspace"><div class="screen" aria-label="圆屏动态脸模拟"><div class="screen-label" id="state-label">待机</div><div class="eyes" id="left"></div><div class="eyes" id="right"></div><div class="mouth" id="mouth"></div><div class="subtitle" id="subtitle">轻微呼吸，偶尔看向两侧</div></div>
<div class="controls"><h2>交互状态</h2><div class="button-row" id="states"><button data-state="idle" aria-pressed="true">待机</button><button data-state="listening" aria-pressed="false">聆听</button><button data-state="thinking" aria-pressed="false">思考</button><button data-state="speaking" aria-pressed="false">说话</button><button data-state="error" aria-pressed="false">故障</button></div>
<h2>情绪</h2><div class="button-row" id="emotions"><button data-emotion="neutral" aria-pressed="true">平静</button><button data-emotion="happy" aria-pressed="false">开心</button><button data-emotion="concerned" aria-pressed="false">关心</button></div>
<p class="description">试试“开心＋说话”，再切到“聆听”，观察动作如何从当前形状平滑转向。</p><label><input id="reduced" type="checkbox">减少动作（自动遵循系统偏好）</label><p>按钮只操控这份模拟。故障优先于情绪；说话嘴形是状态示意，不是声音同步。</p></div></section>
<footer>实际固件由既有设备事件切换状态，不接入这里的模拟按钮。当前补丁保留壁纸优先、皮肤颜色与原音频链路；动画性能与声音同时运行的效果仍需实机验收。</footer>
</main><script>
const labels={idle:['待机','轻微呼吸，偶尔看向两侧'],listening:['聆听','视线集中，保留自然眨眼'],thinking:['思考','稍看向侧上方'],speaking:['说话','嘴形示意正在回答'],error:['故障','保持稳定的警示表情']};
let state='idle',emotion='neutral',last=0,nextBlink=2700,blinkStart=-1,nextGaze=3600,gaze=0,seed=0x57a3;
const pose={ew:28,eh:36,mw:36,mh:8,x:0,y:0,my:38};const reduced=document.getElementById('reduced');reduced.checked=matchMedia('(prefers-reduced-motion:reduce)').matches;
function choose(container,key,value){for(const button of document.getElementById(container).querySelectorAll('button'))button.setAttribute('aria-pressed',String(button.dataset[key]===value))}
document.getElementById('states').addEventListener('click',e=>{if(!e.target.dataset.state)return;state=e.target.dataset.state;choose('states','state',state);document.getElementById('state-label').textContent=labels[state][0];document.getElementById('subtitle').textContent=labels[state][1]});
document.getElementById('emotions').addEventListener('click',e=>{if(!e.target.dataset.emotion)return;emotion=e.target.dataset.emotion;choose('emotions','emotion',emotion)});
function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed}
const origin=performance.now();function frame(clock){const t=clock-origin,dt=Math.min(t-last,100)/1000;last=t;const quiet=reduced.checked||state==='error',blend=reduced.checked?1:1-Math.exp(-dt/.16),breath=quiet?0:Math.sin(t%4400/4400*Math.PI*2);let target={ew:28,eh:36,mw:36,mh:8,x:0,y:breath*.9,my:38+breath*.7};
if(!quiet&&state==='idle'&&t>=nextGaze){gaze=random()%9-4;nextGaze=t+2400+random()%3600}if(!quiet&&state==='idle')target.x=gaze;
if(state==='listening'){target.eh=41;target.mw=28.8;target.mh=6;target.y=-1+breath*.4}if(state==='thinking'){target.ew=23;target.eh=22.32;target.x=reduced.checked?0:5;target.y=reduced.checked?-2:-4+breath*.6}if(state==='speaking'){target.mw=44;target.mh=quiet?12:10+8*Math.abs(.7*Math.sin(t%420/420*Math.PI*2)+.3*Math.sin(t%710/710*Math.PI*2))}if(state==='error'){target.eh=25.2;target.mw=20;target.mh=18;target.x=target.y=0}else if(emotion==='happy'){target.eh*=.82;target.mw=Math.min(64,target.mw+10);target.mh+=3}else if(emotion==='concerned'){target.eh*=.9;target.mw*=.85}
let blink=0;if(quiet){blinkStart=-1;nextBlink=t+2700}else{if(blinkStart<0&&t>=nextBlink)blinkStart=t;if(blinkStart>=0){const age=t-blinkStart;if(age>=220){blinkStart=-1;nextBlink=t+2200+random()%3800}else{const p=age<80?age/80:(220-age)/140;blink=p*p*(3-2*p)}}}for(const key of Object.keys(pose))pose[key]+=(target[key]-pose[key])*blend;
const eh=Math.max(4,pose.eh*(1-.9*blink));const color=state==='error'?'#ff647c':state==='thinking'?'#ffbd4a':state==='listening'?'#38e5a3':emotion==='happy'?'#57d8ff':'#28d7f2';for(const [id,x] of [['left',-42],['right',42]]){const el=document.getElementById(id);el.style.transform=`translate(calc(-50% + ${x+pose.x}px),calc(-50% + ${-18+pose.y}px)) scale(${pose.ew/28},${eh/36})`;el.style.background=color}const mouth=document.getElementById('mouth');mouth.style.transform=`translate(calc(-50% + ${pose.x*.35}px),calc(-50% + ${pose.my}px)) scale(${pose.mw/36},${pose.mh/8})`;mouth.style.background=color;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
