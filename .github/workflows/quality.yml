name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

jobs:
  backend:
    name: Backend synthetic tests
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.23'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/react-chat/.node-version
      - name: Install locked console and test dependencies
        run: uv sync --locked --extra console --group dev
      - name: Test quality report guard
        run: uv run --no-sync python scripts/ci/test_backend_quality.py
      - name: Run isolated backend tests
        run: uv run --no-sync python scripts/ci/backend_quality.py

  frontend:
    name: Frontend and browser tests
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/react-chat
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/react-chat/.node-version
      - name: Install declared pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run component tests
        # 托管 runner 的 CPU 有限，避免多个 jsdom/Ant Design 任务挤占流程用例。
        # 保留所有断言、原 15 秒用例限制和零重试。
        run: pnpm test --maxWorkers=2
      - name: Type check and build
        run: pnpm build
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Prepare synthetic browser backend
        working-directory: .
        run: uv sync --locked --extra console --group dev
      - name: Install Chromium for isolated browser tests
        run: pnpm exec playwright install chromium
      - name: Run browser tests against temporary Fake console
        run: node ../../scripts/ci/browser_quality.mjs
